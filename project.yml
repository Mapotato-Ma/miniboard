# XcodeGen 工程定义 —— 有了它就不需要 Xcode GUI，CI 上一条命令生成 .xcodeproj
# 用法：brew install xcodegen && xcodegen generate
name: MiniBoard

options:
  bundleIdPrefix: com.mapotato
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  minimumXcodeGenVersion: "2.35.0"

settings:
  base:
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "5.0"
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    # 全部关掉签名：CI 上不签名，装到手机时由 SideStore 用你的 Apple ID 现场签
    CODE_SIGNING_ALLOWED: "NO"
    CODE_SIGNING_REQUIRED: "NO"
    CODE_SIGN_IDENTITY: ""
    CODE_SIGN_STYLE: Manual
    DEVELOPMENT_TEAM: ""

targets:
  # ── 主 App ──
  MiniBoard:
    type: application
    platform: iOS
    sources:
      - path: Sources/App
    info:
      path: Sources/App/Info.plist
      properties:
        CFBundleDisplayName: MiniBoard
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.mapotato.miniboard
        TARGETED_DEVICE_FAMILY: "1"
    dependencies:
      - target: MiniBoardWidget
        embed: true

  # ── 组件扩展 ──
  MiniBoardWidget:
    type: app-extension
    platform: iOS
    sources:
      - path: Sources/Widget
    info:
      path: Sources/Widget/Info.plist
      properties:
        CFBundleDisplayName: MiniBoard
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.mapotato.miniboard.widget
        TARGETED_DEVICE_FAMILY: "1"
        APPLICATION_EXTENSION_API_ONLY: "YES"
        SKIP_INSTALL: "YES"
    dependencies:
      - sdk: WidgetKit.framework
      - sdk: SwiftUI.framework

schemes:
  MiniBoard:
    build:
      targets:
        MiniBoard: all
    run:
      config: Debug
    archive:
      config: Release
